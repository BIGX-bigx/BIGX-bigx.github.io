<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="header-actions">
      <nav class="nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>HomePage</a>
        <a href="{{ '/profile/' | relative_url }}" {% if page.url == '/profile/' %}class="active"{% endif %}>Profile</a>
        <a href="{{ '/topics/' | relative_url }}" {% if page.url contains '/topics/' or page.url contains '/categories/' or page.url contains '/tags/' %}class="active"{% endif %}>Topics</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到夜间模式" title="切换日夜模式">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5"></circle>
          <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
