<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://giscus.app 'nonce-YmlneC1ibG9nLXVpLTIwMjY='; object-src 'none'; base-uri 'self'">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<script nonce="YmlneC1ibG9nLXVpLTIwMjY=">
  (function () {
    var storedTheme = null;
    try {
      storedTheme = localStorage.getItem("blog-theme");
    } catch (error) {
      storedTheme = null;
    }
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = storedTheme || (prefersDark ? "dark" : "light");
  })();
</script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/typora-github.css' | relative_url }}?v={{ site.time | date: '%s' }}">
